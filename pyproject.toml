[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-gate"
version = "0.1.0"
description = "Fail-closed PHI guardrails for AI coding agents (Claude Code hooks, CLI, git pre-commit)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "obutuz" }]
keywords = ["hipaa", "phi", "pii", "redaction", "claude-code", "healthcare", "dlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
]
dependencies = []

[project.optional-dependencies]
dev = ["hypothesis>=6.100", "mypy>=1.10", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/obutuz/phi-gate"
Issues = "https://github.com/obutuz/phi-gate/issues"

[project.scripts]
phi-gate = "phi_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phi_gate = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["B023", "E501"]  # long regexes read better unbroken

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"bench/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
